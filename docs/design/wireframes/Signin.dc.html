<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/keel/tokens.css">
<link rel="stylesheet" href="ds/keel/components/bundle.css">
<script src="ds/keel/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:var(--bg);font-family:var(--font-sans);color:var(--ink)}
a{color:var(--accent-ink)}a:hover{color:var(--accent-hover)}
</style>
</helmet>
<main style="min-height: 100vh; box-sizing: border-box; padding: 48px 16px; display: flex; align-items: center; justify-content: center; background: var(--bg); font-family: var(--font-sans); color: var(--ink); font-size: 14px; line-height: 20px;">
  <div style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 32px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="36" height="36" viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="11" width="24" height="3" rx="1.5" style="fill: var(--navy)"></rect><path d="M12.6 16h6.8l-2.2 12.2a1.2 1.2 0 0 1-2.4 0z" style="fill: var(--navy)"></path><circle cx="25" cy="6" r="2.5" style="fill: var(--accent)"></circle></svg>
      <span style="font-weight: 600; font-size: 26px; letter-spacing: -0.02em;">keel</span>
    </div>
    <section style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px; display: flex; flex-direction: column; gap: 20px;">
      <div>
        <h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.01em;">Sign in</h1>
        <p style="margin: 4px 0 0; color: var(--ink-muted);">Steady control over your ad spend.</p>
      </div>
      <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: var(--radius-md); background: var(--accent); color: var(--on-accent); font-weight: 500; text-decoration: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;"><circle cx="9" cy="8" r="4"></circle><path d="M3 20c0-3.3 2.7-6 6-6"></path><path d="M15 13a3 3 0 1 1 3 3v5l-1.5-1.5L18 18"></path></svg>
        Sign in with a passkey
      </a>
      <div style="display: flex; align-items: center; gap: 12px; color: var(--ink-subtle); font-size: 12px;">
        <span style="flex: 1; height: 1px; background: var(--border);"></span>or<span style="flex: 1; height: 1px; background: var(--border);"></span>
      </div>
      <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: var(--radius-md); background: var(--surface); color: var(--ink); border: 1px solid var(--border-strong); font-weight: 500; text-decoration: none;">Continue with Google</a>
      <p style="margin: 0; font-size: 13px; color: var(--ink-subtle);">Your passkey lives on this device or in your password manager. Keel never sees it.</p>
    </section>
    <p style="margin: 0; font-size: 12px; color: var(--ink-subtle); text-align: center;">Self-hosted · one workspace · <a href="#">Privacy</a></p>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
